[project]
name = "hapble"
version = "0.1.0"
description = "A from-scratch HAP-BLE (HomeKit Accessory Protocol over Bluetooth LE) client built on bleak, to control a Nanoleaf Remote from Home Assistant without depending on Apple Home."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<4.0"
keywords = ["homekit", "hap-ble", "bluetooth-low-energy", "nanoleaf", "home-assistant", "mqtt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bleak (>=0.21)",
    "cryptography (>=41)",
    "aiomqtt (>=2.0,<3.0)",
    "python-dotenv (>=1.0)",
]

[project.urls]
Repository = "https://github.com/Jeromearsene/nanoleaf-remote-HA"
Issues = "https://github.com/Jeromearsene/nanoleaf-remote-HA/issues"

[tool.poetry]
# Layout "plat" : le package importable est ./hapble (bibliothèque) ;
# ./tools contient les outils en ligne de commande qui parlent à une vraie
# Remote, exposés par les scripts ci-dessous. Les tests sont dans ./tests.
packages = [
    { include = "hapble" },
    { include = "tools" },
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
pre-commit = ">=3.7"
pytest = ">=8"

[tool.poetry.scripts]
# Contre le vrai appareil, dans l'ordre (voir docs/hapble.md) :
phase1        = "tools.phase1:cli"
phase2        = "tools.phase2:cli"
phase3        = "tools.phase3:cli"
phase4        = "tools.phase4:cli"
phase5        = "tools.phase5:cli"
calibrate     = "tools.calibrate:cli"
bridge        = "tools.bridge:cli"
watch_adv     = "tools.watch_adv:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Base sensible pour un projet perso qui a grandi vite : erreurs Pyflakes,
# style pycodestyle, imports (isort), et bugs courants (flake8-bugbear).
# Volontairement pas plus strict pour l'instant (pas de docstring-style,
# pas de complexité cyclomatique) - le code est deja tres commente/motive
# en prose ; on resserera si le projet grandit.
select = ["E", "F", "I", "B", "W"]
ignore = [
    "E501",  # ligne trop longue : les commentaires en français dépassent
             # parfois 88 caractères ; le formatter gère déjà le code lui-même.
]

[tool.ruff.lint.per-file-ignores]
# Les scripts de test/demo font un usage volontaire de `from module import
# main` en bas de fichier et de variables non utilisées pour la lisibilité
# des logs de debug — pas la peine d'être strict dessus.
"tools/*.py" = ["F401", "F841"]
"tests/*.py" = ["F401", "F841"]
# I, P, A, B, S, K, x, u, v suivent la notation du vecteur de test officiel
# SRP (spec HAP §5.5.2) — les renommer casserait la correspondance directe
# avec le texte de la spec que ce fichier vérifie.
"tests/test_srp_official_vector.py" = ["E741"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
