name: Release

# Push a tag such as v0.1.0 (after merging to main): the workflow checks the
# tag matches the integration's version, then publishes the GitHub release
# that HACS uses for updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches manifest.json and pyproject.toml
        run: python3 scripts/check_versions.py "${GITHUB_REF_NAME}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes ${prerelease}
