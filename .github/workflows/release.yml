name: Release

# Runs on every push to main. When the version in manifest.json has no GitHub
# release yet (i.e. a "version" pull request, made with
# `python scripts/changeset.py version`, was just merged), it publishes
# `v<version>` with that version's CHANGELOG section as the notes. HACS uses
# the release for updates. Nothing happens otherwise.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Versions are consistent
        run: python3 scripts/check_versions.py
      - name: Publish the release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/nanoleaf_remote/manifest.json"))["version"])')
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} is already released: nothing to do."
            exit 0
          fi
          python3 scripts/changeset.py notes "${version}" > "${RUNNER_TEMP}/notes.md"
          prerelease=""
          case "${version}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" \
            --notes-file "${RUNNER_TEMP}/notes.md" ${prerelease}
