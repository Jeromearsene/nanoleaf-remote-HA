name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: ruff check
        run: poetry run ruff check .
      - name: ruff format --check
        run: poetry run ruff format --check .

  test:
    name: Hardware-independent tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Protocol tests (official SRP vector, simulated accessory, face table)
        run: poetry run pytest -q
      - name: Byte-compile every module (catches syntax errors)
        run: |
          python -m py_compile hapble/*.py tools/*.py tests/*.py scripts/*.py custom_components/nanoleaf_remote/*.py
      - name: Vendored hapble copy matches the library
        run: python scripts/sync_vendored.py --check
      - name: Versions are consistent
        run: python scripts/check_versions.py
      - name: Changeset files are valid
        run: python scripts/changeset.py check

  ha-tests:
    name: Home Assistant integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Home Assistant and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant bleak-retry-connector pytest \
            aiousbwatcher habluetooth bluetooth-adapters bluetooth-auto-recovery \
            bluetooth-data-tools dbus-fast pyserial home-assistant-bluetooth
      - name: Integration tests (calibration, discovery, options flow, diagnostics)
        run: python -m pytest -q tests/ha

  # Les outils de `tools/` (phase1 à phase5, calibrate, bridge) ont besoin
  # d'un vrai Bluetooth et d'une vraie Nanoleaf Remote — ils ne peuvent pas
  # tourner en CI. Voir docs/hapble.md (section "Project status") pour ce
  # qui a été validé contre du vrai matériel et comment le reproduire.
