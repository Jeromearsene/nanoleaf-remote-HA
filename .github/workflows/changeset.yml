name: Changeset

# A pull request that changes what users get (custom_components/, hapble/)
# must add a changeset: see .changeset/README.md. Add the `no-changeset` label
# to opt out (internal refactor, revert, ...).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changeset:
    name: Changeset present
    runs-on: ubuntu-24.04
    if: >-
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check the changeset
        run: python3 scripts/changeset.py check --base "origin/${{ github.base_ref }}"
